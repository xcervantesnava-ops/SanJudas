<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Carnicería San Judas</title>
<style>
/* ===== ESTILOS (editar colores aquí) ===== */
:root{--rojo:#b91c1c;--rojo2:#7f1d1d;--fondo:#faf5f2;--tarj:#fff;--txt:#2a1a17;--verde:#15803d;--borde:#e7d9d3}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--txt);padding-bottom:84px}
header{background:var(--rojo);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header h1{font-size:1rem;margin:0}
header input{width:90px;padding:6px;border-radius:8px;border:0;font-size:.9rem}
main{padding:12px;max-width:760px;margin:auto}
.tab{display:none}.tab.on{display:block}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--rojo);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:9px 2px;font-size:.72rem;color:#666}
nav button b{display:block;font-size:1.35rem;font-weight:400}
nav button.on{color:var(--rojo);font-weight:700;background:#fdeceb}
button,.btn{font:inherit;cursor:pointer}
.big{width:100%;min-height:54px;font-size:1.1rem;font-weight:700;border:0;border-radius:12px;background:var(--rojo);color:#fff;margin:6px 0}
.ok{background:var(--verde)}.gris{background:#57534e}
.sm{padding:8px 12px;border:1px solid var(--borde);border-radius:8px;background:#fff;margin:2px}
.sm.del{color:var(--rojo)}
input,select{font:inherit;padding:11px;border:1px solid var(--borde);border-radius:10px;width:100%;margin:4px 0;background:#fff}
input[type=checkbox]{width:22px;height:22px;vertical-align:middle;margin:6px}
label{display:block;margin:4px 0}
.card{background:var(--tarj);border:1px solid var(--borde);border-radius:12px;padding:10px;margin:6px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.item{width:100%;text-align:left;background:#fff;border:1px solid var(--borde);border-radius:10px;padding:11px;margin:4px 0;display:flex;justify-content:space-between}
.low{color:var(--rojo);font-weight:700}
.tot{font-size:1.9rem;font-weight:800;text-align:right;margin:8px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#fff;border-left:6px solid var(--rojo);border-radius:10px;padding:12px}
.kpi small{color:#78716c}.kpi div{font-size:1.5rem;font-weight:800}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}
#modal{display:none;position:fixed;inset:0;background:#000a;z-index:10;overflow:auto;padding:14px}
#modal>div{background:#fff;border-radius:14px;padding:14px;max-width:520px;margin:auto}
canvas{width:100%;height:180px;background:#fff;border-radius:10px;border:1px solid var(--borde)}
h2,h3{margin:14px 0 6px}
#ticket{display:none;font-family:monospace;font-size:13px;width:280px}
@media print{body>*:not(#ticket){display:none!important}#ticket{display:block}}
</style>
</head>
<body>
<header>
  <h1>🥩 Carnicería San Judas</h1>
  <span id="est" style="font-size:1.2rem"></span><input id="cajero" placeholder="Tu nombre" onchange="localStorage.setItem('pos_cajero',this.value)">
</header>
<main>
  <section id="t-venta" class="tab on"></section>
  <section id="t-inv" class="tab"></section>
  <section id="t-prec" class="tab"></section>
  <section id="t-mat" class="tab"></section>
  <section id="t-adm" class="tab"></section>
</main>
<nav id="nav">
  <button data-t="venta" class="on"><b>🛒</b>Vender</button>
  <button data-t="inv"><b>📦</b>Inventario</button>
  <button data-t="prec"><b>💲</b>Precios</button>
  <button data-t="mat"><b>🐖</b>Matanza</button>
  <button data-t="adm"><b>🔐</b>Admin</button>
</nav>
<div id="modal"><div id="mbody"></div></div>
<div id="ticket"></div>

<!-- Lector de códigos (requiere internet la primera vez) -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="var q=document.createElement('script');q.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';document.head.appendChild(q)"></script>
<script>
/* ================= UTILIDADES ================= */
const $=i=>document.getElementById(i);
const G=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}; // leer
const S=(k,v)=>localStorage.setItem(k,JSON.stringify(v)); // guardar
const m=n=>'$'+(+n).toFixed(2);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const dk=d=>{const x=new Date(d);return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate())}; // clave de día
const hora=d=>new Date(d).toLocaleString('es-MX',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
const genCod=()=>'2'+Array.from({length:12},()=>Math.floor(Math.random()*10)).join('');

/* ================= DATOS ================= */
// Productos iniciales: [nombre, categoría, precio, unidad]
const INI=[['Costilla de Puerco','carne',120,'kg'],['Chuleta','carne',110,'kg'],['Pella','carne',60,'kg'],
['Chorizo Casero','carne',130,'kg'],['Hueso','carne',40,'kg'],['Tripa Lavada','menudo',50,'kg'],
['Chanfaina/Dentros','menudo',45,'kg'],['Cuero para Chicharrón','menudo',70,'kg'],
['Carnitas x kg','preparados',220,'kg'],['Chicharrón Prensado','preparados',260,'kg'],
['Chicharrón Botanero','preparados',200,'kg'],['Coca 600ml','abarrotes',20,'pza'],
['Tortilla kg','abarrotes',24,'kg'],['Modelo Latón','cerveza',22,'pza'],
['Victoria Caguama','cerveza',45,'pza'],['Huevo kg','abarrotes',48,'kg']];
let P=G('pos_products',null);
if(!P){P=INI.map((a,i)=>({id:'p'+i,n:a[0],c:a[1],cod:'750100000'+p2(i+1),p:a[2],cost:0,s:10,u:a[3]}));S('pos_products',P)}
let V=G('pos_ventas',[]);        // ventas
let PU=G('pos_puercos',[]);      // puercos
let PIN=G('pos_admin_pin',{p1:'1234',p2:'5678'}); // PINs
let CI=G('pos_cierres',[]);      // cortes de caja cerrados
let cart=[],dom=false,finde=[0,5,6].includes(new Date().getDay()); // finde: auto por día
const CATS=['abarrotes','cerveza','carne','menudo','preparados'];
const guardaP=()=>{S('pos_products',P);pushPatch({products:obj(P,p=>p.id)})};
const sesion=()=>G('pos_session',null);
const esAdmin=()=>{const s=sesion();return s&&s.rol=='admin'};

/* ================= MODAL ================= */
function openM(h){$('mbody').innerHTML=h;$('modal').style.display='block'}
function closeM(){$('modal').style.display='none';$('mbody').innerHTML=''}

/* ================= TABS ================= */
const REND={venta:rVenta,inv:rInv,prec:rPrec,mat:rMat,adm:rAdm};
function show(t){
  document.querySelectorAll('.tab').forEach(e=>e.classList.remove('on'));
  $('t-'+t).classList.add('on');
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));
  REND[t]();scrollTo(0,0);
}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>show(b.dataset.t));

/* ================= A) VENTAS ================= */
function rVenta(){
  $('t-venta').innerHTML=`
  <button class="big" onclick="scan()">📷 Escanear</button>
  <input id="q" placeholder="Buscar por nombre o código de barras" oninput="lista()" onkeydown="if(event.key=='Enter')buscaCod(this.value)">
  <label><input type="checkbox" id="fd" ${finde?'checked':''} onchange="finde=this.checked;lista()"> Fin de semana (mostrar Preparados)</label>
  <div id="lst"></div>
  <h3>🧾 Carrito</h3><div id="cart"></div>
  <label><input type="checkbox" id="dm" ${dom?'checked':''} onchange="dom=this.checked;rCart()"> Domicilio +$10</label>
  <div class="tot" id="tot"></div>
  <button class="big ok" onclick="cobrar()">💵 Cobrar</button>`;
  lista();rCart();
}
function lista(){
  const q=($('q').value||'').toLowerCase().trim();
  const r=P.filter(p=>(finde||p.c!='preparados')&&(!q||p.n.toLowerCase().includes(q)||p.cod==q));
  $('lst').innerHTML=r.map(p=>`<button class="item" onclick="add('${p.id}')"><span>${esc(p.n)}</span>
   <span>${m(p.p)}/${p.u} · <span class="${p.s<5?'low':''}">${p.s} ${p.u}</span></span></button>`).join('')||'<p>Sin resultados</p>';
}
function add(id,q){
  const l=cart.find(x=>x.id==id);
  if(l)l.q+=(q||1);else cart.push({id:id,q:q||1});
  rCart();
}
function buscaCod(c,esc2){ // busca por código exacto y agrega
  c=String(c||'').trim();
  const p=P.find(x=>x.cod==c);
  if(!p){const e=$('se')||{};e.textContent='❌ Código no encontrado: '+c;if(!esc2&&!$('se'))alert('Código no encontrado');return false}
  add(p.id);
  if($('se'))$('se').textContent='✔ '+p.n+' agregado';
  if($('q')&&!esc2)$('q').value='';
  if(!esc2)lista();
  return true;
}
function setQ(i,v){cart[i].q=Math.max(0,parseFloat(v)||0);if(!cart[i].q)cart.splice(i,1);rCart()}
function rCart(){
  let t=0;
  $('cart').innerHTML=cart.map((l,i)=>{const p=P.find(x=>x.id==l.id);if(!p)return'';t+=p.p*l.q;
    return`<div class="card row"><div style="flex:1">${esc(p.n)}<br><small>${m(p.p)}/${p.u}</small></div>
    <input type="number" step="0.1" min="0" value="${l.q}" style="width:80px" onchange="setQ(${i},this.value)">
    <b>${m(p.p*l.q)}</b><button class="sm del" onclick="setQ(${i},0)">✕</button></div>`}).join('')||'<p>Vacío</p>';
  if(dom&&cart.length)t+=10;
  $('tot').textContent='Total: '+m(t);
}
function cobrar(){
  if(!cart.length)return alert('Carrito vacío');
  const items=cart.map(l=>{const p=P.find(x=>x.id==l.id);return{id:p.id,n:p.n,c:p.c,q:l.q,p:p.p,cost:p.cost||0,u:p.u}});
  const falta=items.filter(i=>P.find(x=>x.id==i.id).s<i.q).map(i=>i.n);
  if(falta.length&&!confirm('Stock insuficiente de: '+falta.join(', ')+'. ¿Cobrar de todos modos?'))return;
  const sub=items.reduce((a,i)=>a+i.p*i.q,0);
  const v={id:Date.now(),f:new Date().toISOString(),total:sub+(dom?10:0),dom:dom,cajero:localStorage.getItem('pos_cajero')||'Sin nombre',items:items};
  items.forEach(i=>{const p=P.find(x=>x.id==i.id);p.s=Math.round((p.s-i.q)*1000)/1000}); // descuenta stock
  V.push(v);S('pos_ventas',V);guardaP();pushPatch({['ventas/'+v.id]:v});
  // Ticket imprimible
  $('ticket').innerHTML=`<center><b>🥩 CARNICERÍA SAN JUDAS</b><br>${hora(v.f)}<br>Cajero: ${esc(v.cajero)}</center><hr>`+
   items.map(i=>`${esc(i.n)}<br>&nbsp;${i.q} ${i.u} x ${m(i.p)} = ${m(i.p*i.q)}<br>`).join('')+
   (dom?'Domicilio: $10.00<br>':'')+`<hr><b>TOTAL: ${m(v.total)}</b><br><center>¡Gracias por su compra!</center>`;
  cart=[];dom=false;rVenta();
  setTimeout(()=>window.print(),150);
}

/* ===== Lector de códigos (cámara en vivo + foto de respaldo + manual) ===== */
let qr=null,ultimo='',ultT=0;
function scan(){
  openM(`<h3>📷 Escanear código</h3><div id="rd" style="width:100%;min-height:200px"></div><div id="rd2" style="display:none"></div>
  <p id="se">Iniciando cámara…</p>
  <label class="btn big ok" style="display:flex;align-items:center;justify-content:center;border-radius:12px;color:#fff">📸 Tomar foto del código
  <input type="file" accept="image/*" capture="environment" style="display:none" onchange="scanFoto(this)"></label>
  <input id="mc" placeholder="Código manual" inputmode="numeric">
  <button class="big" onclick="buscaCod($('mc').value,true);$('mc').value=''">Agregar código manual</button>
  <button class="big gris" onclick="stopScan();rCart()">Cerrar</button>`);
  const err=t=>$('se').textContent='⚠️ '+t+' Usa 📸 foto o código manual.';
  if(typeof Html5Qrcode=='undefined')return err('No cargó el lector (sin internet).');
  if(!window.isSecureContext)return err('La cámara en vivo solo funciona desde una dirección https.');
  try{
    qr=new Html5Qrcode('rd',{useBarCodeDetectorIfSupported:true,verbose:false});
    qr.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.min(w-20,300),height:Math.min(h-20,160)})},
      t=>{if(t==ultimo&&Date.now()-ultT<2500)return;ultimo=t;ultT=Date.now();
          if(buscaCod(t,true)){try{navigator.vibrate(120)}catch(e){}}},()=>{})
      .then(()=>{$('se').textContent='Apunta al código de barras'})
      .catch(e=>err('Cámara falló ('+e+'). Revisa el permiso de cámara del navegador.'));
  }catch(e){err('Cámara no disponible: '+e.message)}
}
function scanFoto(inp){ // lee el código desde una foto (funciona aunque no haya https)
  const f=inp.files[0];if(!f)return;
  if(typeof Html5Qrcode=='undefined'){$('se').textContent='⚠️ Lector no cargado. Usa código manual.';return}
  try{new Html5Qrcode('rd2').scanFile(f,false).then(t=>{buscaCod(t,true)})
    .catch(()=>{$('se').textContent='❌ No se leyó. Acerca la foto, con buena luz, e intenta otra vez.'})}
  catch(e){$('se').textContent='⚠️ '+e.message}
  inp.value='';
}
function stopScan(){try{if(qr){qr.stop().catch(()=>{});qr=null}}catch(e){}closeM()}

/* ================= B) INVENTARIO ================= */
function rInv(){
  const a=esAdmin();
  $('t-inv').innerHTML=(a?'<button class="big" onclick="editP()">➕ Agregar producto</button>':'')+
  CATS.map(c=>{const r=P.filter(p=>p.c==c);if(!r.length)return'';
   return`<h3>${c.toUpperCase()}</h3>`+r.map(p=>`<div class="card row"><div><b>${esc(p.n)}</b><br>
   <small>${p.cod} · ${m(p.p)}/${p.u}${a?' · costo '+m(p.cost||0):''}</small></div>
   <div style="text-align:right"><span class="${p.s<5?'low':''}">${p.s<5?'⚠️ ':''}${p.s} ${p.u}</span>
   ${a?`<br><button class="sm" onclick="editP('${p.id}')">✏️</button><button class="sm del" onclick="delP('${p.id}')">🗑</button>`:''}</div></div>`).join('')}).join('')+
  (a?'':'<p><small>Solo el administrador puede editar el inventario.</small></p>');
}
function editP(id){
  const p=P.find(x=>x.id==id)||{n:'',c:'abarrotes',cod:'',p:0,cost:0,s:0,u:'pza'};
  openM(`<h3>${id?'Editar':'Nuevo'} producto</h3>
  <label>Nombre<input id="f_n" value="${esc(p.n)}"></label>
  <label>Categoría<select id="f_c">${CATS.map(c=>`<option ${c==p.c?'selected':''}>${c}</option>`).join('')}</select></label>
  <label>Código de barras<input id="f_cod" value="${p.cod}"></label>
  <button class="sm" onclick="$('f_cod').value=genCod()">🎲 Generar código</button>
  <div class="g2"><label>Precio venta<input id="f_p" type="number" step="0.01" value="${p.p}"></label>
  <label>Costo (opcional)<input id="f_cost" type="number" step="0.01" value="${p.cost||0}"></label>
  <label>Stock<input id="f_s" type="number" step="0.01" value="${p.s}"></label>
  <label>Unidad<select id="f_u"><option ${p.u=='kg'?'selected':''}>kg</option><option ${p.u=='pza'?'selected':''}>pza</option></select></label></div>
  <button class="big ok" onclick="saveP('${id||''}')">Guardar</button><button class="big gris" onclick="closeM()">Cancelar</button>`);
}
function saveP(id){
  const n=$('f_n').value.trim();if(!n)return alert('Falta el nombre');
  const d={n:n,c:$('f_c').value,cod:$('f_cod').value.trim()||genCod(),p:+$('f_p').value||0,cost:+$('f_cost').value||0,s:+$('f_s').value||0,u:$('f_u').value};
  if(id)Object.assign(P.find(x=>x.id==id),d);else{d.id='p'+Date.now();P.push(d)}
  guardaP();closeM();rInv();
}
function delP(id){if(confirm('¿Eliminar producto?')){P=P.filter(x=>x.id!=id);guardaP();rInv()}}

/* ================= C) PRECIOS RÁPIDOS (solo admin) ================= */
function loginBox(){
  return`<div class="card"><h3>🔐 Acceso de administrador</h3><input id="pin" type="password" inputmode="numeric" placeholder="PIN">
  <button class="big" onclick="login()">Entrar</button></div>`;
}
function login(){
  const v=$('pin').value;
  if(v==PIN.p1)S('pos_session',{rol:'admin',nombre:'Patrón 1'});
  else if(v==PIN.p2)S('pos_session',{rol:'admin',nombre:'Patrón 2'});
  else return alert('PIN incorrecto');
  const t=document.querySelector('.tab.on').id.slice(2);show(t);
}
function rPrec(){
  if(!esAdmin()){$('t-prec').innerHTML=loginBox();return}
  $('t-prec').innerHTML='<h3>💲 Precio de carne del día</h3>'+P.filter(p=>p.c=='carne'||p.c=='menudo').map(p=>
   `<div class="card row"><b style="flex:1">${esc(p.n)}</b><span>$</span><input type="number" step="0.5" value="${p.p}" style="width:100px;font-size:1.2rem"
   onchange="P.find(x=>x.id=='${p.id}').p=+this.value||0;guardaP();this.style.background='#dcfce7'"></div>`).join('');
}

/* ================= D) MATANZA ================= */
const CORTES=[['costilla','Costilla de Puerco'],['chuleta','Chuleta'],['pella','Pella'],['chorizo','Chorizo Casero'],
['hueso','Hueso'],['tripa','Tripa Lavada'],['dentros','Chanfaina/Dentros'],['cuero','Cuero para Chicharrón']];
function estimaGan(pu){ // ganancia estimada = valor de todos los cortes - costo del puerco
  let t=0;CORTES.forEach(c=>{const p=P.find(x=>x.n==c[1]);if(p)t+=(pu.cortes[c[0]]||0)*p.p});return t-pu.costo;
}
function rMat(){
  $('t-mat').innerHTML=`<h3>🐖 Registrar puerco</h3><div class="card">
  <div class="g2"><label>Peso vivo (kg)<input id="m_peso" type="number" step="0.1"></label>
  <label>Costo del puerco $<input id="m_costo" type="number" step="0.01"></label></div>
  <small>Fecha: ${hora(new Date())}</small><h4>Desglose (kg)</h4>
  <div class="g2">${CORTES.map(c=>`<label>${c[1]}<input id="m_${c[0]}" type="number" step="0.1"></label>`).join('')}</div>
  <button class="big ok" onclick="regPuerco()">Registrar Puerco</button></div>`+
  (esAdmin()?histPuercos():'<p><small>El historial lo ve el administrador.</small></p>');
}
function histPuercos(){
  return'<h3>Historial de puercos</h3>'+([...PU].reverse().map(u=>{const g=estimaGan(u);
   return`<div class="card"><b>${hora(u.f)}</b> · ${u.kg.toFixed(1)} kg de cortes (vivo ${u.peso} kg)<br>
   Costo ${m(u.costo)} · Ganancia estimada <b style="color:${g>=0?'#15803d':'#b91c1c'}">${m(g)}</b></div>`}).join('')||'<p>Sin registros</p>');
}
function regPuerco(){
  const pu={id:Date.now(),f:new Date().toISOString(),peso:+$('m_peso').value||0,costo:+$('m_costo').value||0,cortes:{},kg:0};
  CORTES.forEach(c=>{const v=+$('m_'+c[0]).value||0;pu.cortes[c[0]]=v;pu.kg+=v});
  if(!pu.kg)return alert('Captura los kg de al menos un corte');
  CORTES.forEach(c=>{const p=P.find(x=>x.n==c[1]);if(p)p.s=Math.round((p.s+pu.cortes[c[0]])*1000)/1000}); // suma al stock
  PU.push(pu);S('pos_puercos',PU);guardaP();pushPatch({['puercos/'+pu.id]:pu});
  alert('Puerco registrado. Stock actualizado.');rMat();
}

/* ================= E) ADMIN ================= */
const sumV=a=>a.reduce((s,v)=>s+v.total,0);
function rAdm(){
  const s=sesion();
  if(!s){$('t-adm').innerHTML=loginBox();return}
  const hoy=dk(new Date()),vh=V.filter(v=>dk(v.f)==hoy);
  const sem=V.filter(v=>(Date.now()-new Date(v.f))<7*864e5);
  const puH=PU.filter(u=>dk(u.f)==hoy),costoH=puH.reduce((a,u)=>a+u.costo,0);
  const bajo=P.filter(p=>p.s<5);
  // Corte de caja: ventas desde el último cierre
  const ult=CI.length?CI[CI.length-1].f:'';const vc=V.filter(v=>v.f>ult);
  const porCat={};CATS.forEach(c=>porCat[c]=0);
  vc.forEach(v=>v.items.forEach(i=>porCat[i.c]=(porCat[i.c]||0)+i.p*i.q));
  const doms=vc.filter(v=>v.dom);

   <div class="kpi"><small>Número de ventas hoy</small><div>${vh.length}</div></div>
   <div class="kpi"><small>Puercos hoy</small><div>${puH.length}</div></div>

   <div class="kpi"><small>Productos bajo stock</small><div class="${bajo.length?'low':''}">${bajo.length}</div></div></div>
  ${bajo.length?'<p class="low">⚠️ '+bajo.map(p=>esc(p.n)).join(', ')+'</p>':''}
  <h3>Ventas últimos 7 días</h3><canvas id="cv"></canvas>
  <h3>Por cajero (hoy)</h3>${Object.keys(pc).map(k=>`<div class="card row"><span>${esc(k)}</span><b>${m(pc[k])}</b></div>`).join('')||'<p>Sin ventas hoy</p>'}
  <h3>🧮 Corte de caja</h3><div class="card">${Object.keys(porCat).map(k=>`<div class="row"><span>${k}</span><b>${m(porCat[k])}</b></div>`).join('')}
   <div class="row"><span>Domicilios (${doms.length})</span><b>${m(doms.length*10)}</b></div><hr>
   <div class="row"><b>Dinero en caja</b><b style="font-size:1.4rem">${m(sumV(vc))}</b></div>
   <small>${vc.length} ventas desde ${ult?hora(ult):'el inicio'}</small>
   <button class="big" onclick="cerrarCaja()">Cerrar Caja</button></div>
  <h3>Historial de puercos</h3>${histPuercos()}
  <h3>Historial de ventas (últimas 50)</h3>${[...V].reverse().slice(0,50).map(v=>`<div class="card"><div class="row"><b>${hora(v.f)} · ${esc(v.cajero)}</b><b>${m(v.total)}</b></div>
   <small>${v.items.map(i=>i.q+' '+i.u+' '+esc(i.n)).join(', ')}${v.dom?' · 🛵 domicilio':''}</small></div>`).join('')||'<p>Sin ventas</p>'}
  <h3>💾 Respaldo</h3><button class="big gris" onclick="exportar()">Exportar respaldo JSON</button>

  <button class="big gris" onclick="cambiaPins()">Guardar PINs</button>
  <h3>☁️ Ver todo en tiempo real</h3><div class="card"><small>Pega la dirección de tu Firebase Realtime Database. Usa la MISMA en todos los teléfonos (conecta primero el del cajero).</small>
  <input id="cu" placeholder="https://xxxx-default-rtdb.firebaseio.com" value="${esc(CL.url)}"><button class="big" onclick="nubeGuarda()">Conectar</button>

   <b>iPhone (Safari):</b> botón Compartir ⬆️ → "Agregar a pantalla de inicio".<br>
   Para instalarla como PWA real debe abrirse desde una dirección https (ej. GitHub Pages). Para offline completo sube también el archivo sw.js:</small>
   <button class="sm" onclick="bajaSW()">Descargar sw.js</button></div>`;

}
function chart(){ // gráfica de barras con canvas
  const c=$('cv');if(!c)return;const x=c.getContext('2d'),w=c.width=c.clientWidth,h=c.height=180;
  const d=[];for(let i=6;i>=0;i--){const t=new Date();t.setDate(t.getDate()-i);const k=dk(t);
    d.push([t.getDate()+'/'+(t.getMonth()+1),sumV(V.filter(v=>dk(v.f)==k))])}
  const mx=Math.max(1,...d.map(a=>a[1])),bw=w/7;
  d.forEach((a,i)=>{const bh=(h-45)*a[1]/mx;x.fillStyle='#b91c1c';x.fillRect(i*bw+8,h-20-bh,bw-16,bh);
    x.fillStyle='#333';x.font='11px sans-serif';x.textAlign='center';x.fillText(a[0],i*bw+bw/2,h-6);x.fillText('$'+Math.round(a[1]),i*bw+bw/2,h-24-bh)});
}
function cerrarCaja(){
  if(!confirm('¿Cerrar caja? El corte vuelve a cero.'))return;
  const ult=CI.length?CI[CI.length-1].f:'';
  CI.push({f:new Date().toISOString(),total:sumV(V.filter(v=>v.f>ult)),por:sesion().nombre});
  S('pos_cierres',CI);pushPatch({cierres:obj(CI,ck)});rAdm();
}
function exportar(){
  const b=new Blob([JSON.stringify({pos_products:P,pos_puercos:PU,pos_ventas:V,pos_admin_pin:PIN,pos_cierres:CI})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='respaldo-pos-'+dk(new Date())+'.json';a.click();
}
function importar(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm('Esto reemplaza los datos actuales. ¿Continuar?'))return;
    S('pos_products',d.pos_products||[]);S('pos_puercos',d.pos_puercos||[]);S('pos_ventas',d.pos_ventas||[]);
    S('pos_admin_pin',d.pos_admin_pin||PIN);S('pos_cierres',d.pos_cierres||[]);location.reload()}catch(e){alert('Archivo inválido')}};
  r.readAsText(f);
}
function cambiaPins(){
  const a=$('n1').value.trim(),b=$('n2').value.trim();
  if(a)PIN.p1=a;if(b)PIN.p2=b;S('pos_admin_pin',PIN);alert('PINs guardados');
}

/* ================= F) PWA ================= */
// Service worker mínimo (cachea la página para usarla sin internet)
const SW_CODE="const C='pos-v2';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['./','./index.html'])));self.skipWaiting()});"+
"self.addEventListener('fetch',e=>{if(e.request.method!='GET'||e.request.url.includes('firebaseio'))return;e.respondWith(fetch(e.request).then(r=>{const k=r.clone();caches.open(C).then(c=>c.put(e.request,k));return r}).catch(()=>caches.match(e.request)))});";
function bajaSW(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([SW_CODE],{type:'text/javascript'}));a.download='sw.js';a.click()}
(function pwa(){
  try{
    // Icono: canvas rojo con emoji 🥩
    const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
    x.fillStyle='#b91c1c';x.fillRect(0,0,512,512);x.font='320px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🥩',256,276);
    const ico=c.toDataURL('image/png');
    const l=document.createElement('link');l.rel='apple-touch-icon';l.href=ico;document.head.appendChild(l);
    const l2=document.createElement('link');l2.rel='icon';l2.href=ico;document.head.appendChild(l2);
    // Manifest generado como Blob
    const man={name:'Carnicería San Judas',short_name:'San Judas',start_url:location.href.split('#')[0],display:'standalone',
      background_color:'#b91c1c',theme_color:'#b91c1c',icons:[{src:ico,sizes:'512x512',type:'image/png',purpose:'any'}]};
    const lm=document.createElement('link');lm.rel='manifest';
    lm.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));document.head.appendChild(lm);
    // Service worker: solo funciona en https/localhost y con sw.js junto al HTML
    if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){console.log('PWA:',e)}
})();

/* ================= NUBE: tiempo real con Firebase Realtime Database (REST, sin librerías) ================= */
const NUBE_URL='https://carniceria-33351-default-rtdb.firebaseio.com'; // dirección de tu base (editar aquí si cambia)
let CL=G('pos_cloud',{url:''});if(!CL.url)CL.url=NUBE_URL;
let es=null,tm=null,pend=G('pos_pend',false),nubeOk=false;
const curl=p=>CL.url+'/'+p+'.json';
const obj=(a,fn)=>{const o={};a.forEach(x=>o[fn(x)]=x);return o};
const ck=c=>c.f.replace(/\W/g,'_');
function setEst(t){const e=$('est');if(e)e.textContent=t}
function pushPatch(o){ // sube cambios a la nube; si falla, queda pendiente
  if(!CL.url)return;
  fetch(curl(''),{method:'PATCH',body:JSON.stringify(o)}).then(r=>{if(!r.ok)throw 0;nubeOk=true;setEst('☁️')})
   .catch(()=>{pend=true;S('pos_pend',true);setEst('📴')});
}
function pushAll(){pushPatch({products:obj(P,p=>p.id),ventas:obj(V,v=>v.id),puercos:obj(PU,u=>u.id),cierres:obj(CI,ck)})}
function pull(){ // baja y mezcla los datos de la nube
  if(!CL.url)return;
  fetch(curl('')).then(r=>r.json()).then(d=>{
    d=d||{};
    if(!d.products&&P.length){pushAll();return} // nube vacía: sube lo local
    if(d.products){P=Object.values(d.products);S('pos_products',P)}
    if(d.ventas){const o=obj(V,v=>v.id);Object.assign(o,d.ventas);V=Object.values(o).sort((a,b)=>a.f<b.f?-1:1);S('pos_ventas',V)}
    if(d.puercos){const o=obj(PU,u=>u.id);Object.assign(o,d.puercos);PU=Object.values(o).sort((a,b)=>a.f<b.f?-1:1);S('pos_puercos',PU)}
    if(d.cierres){const o=obj(CI,ck);Object.assign(o,d.cierres);CI=Object.values(o).sort((a,b)=>a.f<b.f?-1:1);S('pos_cierres',CI)}
    nubeOk=true;setEst('☁️');refresca();
  }).catch(()=>setEst('📴'));
}
function refresca(){ // actualiza la pantalla sin estorbar si estás escribiendo
  const a=document.activeElement;if(a&&/INPUT|SELECT/.test(a.tagName))return;
  if($('modal').style.display=='block')return;
  const t=document.querySelector('.tab.on').id.slice(2);
  if(t=='venta')lista();else if(t!='prec')REND[t]();
}
function conecta(){
  if(es){es.close();es=null}
  if(!CL.url){setEst('');return}
  if(pend){pend=false;S('pos_pend',false);pushAll()}
  pull();
  try{es=new EventSource(curl('')); // Firebase avisa cada cambio en vivo
    const h=()=>{clearTimeout(tm);tm=setTimeout(pull,400)};
    es.addEventListener('put',h);es.addEventListener('patch',h);es.onerror=()=>setEst('📴');
  }catch(e){}
}
function nubeGuarda(){
  CL.url=$('cu').value.trim().replace(/\/+$/,'');S('pos_cloud',CL);conecta();
  alert(CL.url?'Conectando a la nube…':'Nube desactivada');setTimeout(rAdm,1500);
}
window.addEventListener('online',conecta);

$('cajero').value=localStorage.getItem('pos_cajero')||'';
rVenta();conecta();
